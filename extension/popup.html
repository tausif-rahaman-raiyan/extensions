<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prayer Focus</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Hind+Siliguri:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Clean Compact Header Bar -->
  <header class="popup-header">
    <div class="popup-brand">
      <div class="logo-icon-wrap">
        <svg viewBox="0 0 128 128" class="logo-svg">
          <path d="M78 24 C46 24 22 48 22 80 C22 104 38 114 54 114 C36 102 34 76 52 52 C64 36 78 30 78 24 Z" fill="#34D399"/>
          <polygon transform="translate(80, 52) scale(0.9)" points="0,-18 5,-6 18,-5 8,4 12,16 0,9 -12,16 -8,4 -18,-5 -5,-6" fill="#F59E0B"/>
        </svg>
      </div>
      <div>
        <div class="brand-title-wrap">
          <span class="brand-title">Prayer Focus</span>
          <span class="live-badge">Live Sync</span>
        </div>
        <div class="provider-info" id="providerLabel">AlAdhan · Online</div>
      </div>
    </div>
    <div class="location-badge" id="locationLabel">Chattogram</div>
  </header>

  <!-- Hero Next Prayer Countdown -->
  <section class="hero-waqt">
    <div class="waqt-meta">
      <span>Next Prayer: <strong id="nextPrayerName">Asr</strong></span>
      <span id="nextPrayerTime">--:--</span>
    </div>
    <div class="countdown-large font-mono" id="countdownVal">00:00:00</div>
    <div class="progress-bar-bg">
      <div class="progress-bar-fill" id="progressBar"></div>
    </div>
  </section>

  <!-- Tahajjud Status -->
  <section class="tahajjud-box">
    <div>
      <div class="tahajjud-title">Tahajjud (Last Third of Night)</div>
      <div class="tahajjud-sub" id="tahajjudStatus">Tonight's window starts at --:--</div>
    </div>
    <div class="tahajjud-timer font-mono" id="tahajjudCountdown">--:--:--</div>
  </section>

  <!-- 6 Prayer Times Cards with Start & Limit -->
  <section class="prayers-list" id="prayersList">
    <!-- Populated dynamically: 5:45 AM with Limit: 7:01 AM etc. -->
  </section>

  <!-- Action Section Matching User Image: [Open Dashboard ↗] and [⚙ Settings] -->
  <div class="dashboard-actions">
    <button class="btn btn-dashboard" id="openDashboardBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="3" width="7" height="7"></rect>
        <rect x="14" y="3" width="7" height="7"></rect>
        <rect x="14" y="14" width="7" height="7"></rect>
        <rect x="3" y="14" width="7" height="7"></rect>
      </svg>
      <span>Open Dashboard ↗</span>
    </button>
    <button class="btn btn-settings" id="openSettingsBtn">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"></path>
        <circle cx="12" cy="12" r="3"></circle>
      </svg>
      <span>Settings</span>
    </button>
  </div>

  <!-- Location line matching user image: ✦ Chattogram, Bangladesh (Asia/Dhaka) -->
  <div class="location-line">
    <span class="sparkle-icon">✦</span>
    <span id="locationFooterText">Chattogram, Bangladesh (Asia/Dhaka)</span>
  </div>

  <!-- Secondary Tab Quick Actions -->
  <footer class="footer">
    <button class="btn btn-subtle btn-refresh-full" id="refreshBtn">↻ Refresh</button>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
