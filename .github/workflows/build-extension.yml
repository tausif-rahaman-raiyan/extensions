name: Build and Package Prayer Focus Extension

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build & Release Extension ZIP
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci || npm install

      - name: Validate extension JavaScript syntax
        run: |
          node --check extension/background.js
          node --check extension/popup.js

      - name: Build Web App & Extension ZIP
        run: |
          npm run build
          node scripts/pack-extension.js

      - name: Verify Extension ZIP Exists
        run: |
          ls -lh public/Prayer-Focus-v2.2.21-Fixed.zip
          ls -lh Prayer-Focus-v2.2.21-Fixed.zip

      - name: Upload Extension ZIP Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Prayer-Focus-Chrome-Extension-v2.2.21
          path: Prayer-Focus-v2.2.21-Fixed.zip
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release (on tag)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: Prayer-Focus-v2.2.21-Fixed.zip
          name: Prayer Focus Extension ${{ github.ref_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
